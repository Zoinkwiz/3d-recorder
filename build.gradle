plugins {
	id 'java'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(11)
	}
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = findProperty('runeliteVersion') ?: 'latest.release'
def pluginMainClass = 'com.extrinsiccognition.embertide.EmbertidePluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:4.11.0'
}

group = 'com.extrinsiccognition'
version = '0.5.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Client-thread cost of a raid tick at 1, 8 and 30 actors: ./gradlew bench [-Pticks=300]
tasks.register('bench', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.extrinsiccognition.embertide.RaidTickBench'
	javaLauncher = javaToolchains.launcherFor(java.toolchain)
	args findProperty('ticks') ?: '300'
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	// JavaExec must explicitly use the selected toolchain.
	javaLauncher = javaToolchains.launcherFor(java.toolchain)

	jvmArgs "-ea"

	// RuneLite's macOS fullscreen adapter requires access to com.apple.eawt.
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		jvmArgs "--add-exports", "java.desktop/com.apple.eawt=ALL-UNNAMED"
	}

	args "--developer-mode", "--debug"
}

// Reads saved recordings in place and checks they open and seek: ./gradlew inspectRecording -Precording=<file or folder> [-Pterrain=true]
tasks.register('inspectRecording', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.extrinsiccognition.embertide.viewer.RecordingInspector'
	javaLauncher = javaToolchains.launcherFor(java.toolchain)
	args findProperty('recording') ?: ''
	if (findProperty('terrain')) { systemProperty 'embertide.inspect.terrain', 'true' }
}

jar {
	// The viewer's BSD notices travel with the plugin.
	from(['LICENSE', 'THIRD-PARTY-NOTICES.md']) { into 'META-INF/3d-recorder' }
}
